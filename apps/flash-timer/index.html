<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フラッシュタイマー — 50分/10分</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#14161a; --muted:#6b7280;
    --line:#e3e5ea; --work:#2563eb; --brk:#16a34a; --wait:#9ca3af;
    --accent:var(--work); --shadow:0 1px 2px rgba(16,18,22,.06),0 8px 24px rgba(16,18,22,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1014; --panel:#171a20; --ink:#eef1f6; --muted:#9aa3b2;
      --line:#262b34; --work:#60a5fa; --brk:#4ade80; --wait:#6b7280;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px; margin:0 auto; padding:24px 16px 64px}
  h1{font-size:15px; font-weight:600; letter-spacing:.02em; margin:0 0 2px}
  .sub{font-size:13px; color:var(--muted); margin:0 0 20px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:20px; margin-bottom:16px}

  .badge{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600;
    padding:5px 12px; border-radius:999px; color:#fff; background:var(--accent)}
  .badge .dot{width:7px; height:7px; border-radius:50%; background:#fff; opacity:.9}
  .clock{font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:-.02em;
    font-size:clamp(56px,17vw,104px); line-height:1; margin:14px 0 6px}
  .next{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
  .next b{color:var(--ink); font-weight:600}
  .bar{height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin:18px 0 4px}
  .bar>i{display:block; height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .25s linear}
  .meta{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
  input[type=time],input[type=number]{
    width:100%; padding:9px 11px; font-size:16px; font-family:inherit; font-variant-numeric:tabular-nums;
    color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px}
  input:focus-visible,button:focus-visible{outline:2px solid var(--work); outline-offset:2px}
  .checks{display:flex; flex-wrap:wrap; gap:16px; margin-top:16px}
  .check{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink)}
  .check input{width:16px; height:16px; accent-color:var(--work)}
  .btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
  button{font:inherit; font-size:13px; font-weight:600; padding:9px 14px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer}
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--work); border-color:var(--work); color:#fff}
  button:disabled{opacity:.38; cursor:default}
  button:disabled:hover{border-color:var(--line)}
  .btns .spacer{flex:1 0 8px}

  h2{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.06em; margin:0 0 12px}
  ol{list-style:none; margin:0; padding:0}
  ol li{display:flex; align-items:baseline; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:14px}
  ol li:first-child{border-top:0}
  ol time{font-variant-numeric:tabular-nums; font-weight:600; min-width:64px}
  ol span{font-size:13px; color:var(--muted)}
  ol li.soon time{color:var(--accent)}
  ol li span:only-child{color:var(--muted); font-size:13px}
  .hint{font-size:12px; color:var(--muted); margin:12px 0 0; line-height:1.6}

  #flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:99}
  #flash.on{animation:pulse 1.5s steps(1,end) 3}
  @keyframes pulse{0%{opacity:.92} 50%{opacity:0} 100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    #flash.on{animation:fade 1.8s ease-out 1}
    @keyframes fade{0%{opacity:.55} 100%{opacity:0}}
  }
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>

<div class="wrap">
  <h1>フラッシュタイマー</h1>
  <p class="sub">開始時刻から「作業50分 → 休憩10分」を繰り返し、切り替わるたびに画面を光らせます。</p>

  <div class="card">
    <span class="badge" id="badge"><span class="dot"></span><span id="phase">開始待ち</span></span>
    <div class="clock" id="clock">--:--</div>
    <div class="next">次のフラッシュ <b id="nextAt">--:--</b> <span id="cycleNo"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="meta"><span id="segFrom">--:--</span><span id="segTo">--:--</span></div>
  </div>

  <div class="card">
    <div class="grid">
      <div><label for="start">開始時刻</label><input type="time" id="start" value="08:30"></div>
      <div><label for="work">作業（分）</label><input type="number" id="work" value="50" min="1" max="600"></div>
      <div><label for="brk">休憩（分）</label><input type="number" id="brk" value="10" min="1" max="600"></div>
    </div>
    <div class="checks">
      <label class="check"><input type="checkbox" id="sound" checked>音も鳴らす</label>
      <label class="check"><input type="checkbox" id="atStart">開始時にも光らせる</label>
      <label class="check"><input type="checkbox" id="awake" checked>画面を消さない</label>
    </div>
    <div class="btns">
      <button class="primary" id="go">スタート</button>
      <button id="stop">停止</button>
      <button id="reset">リセット</button>
      <span class="spacer"></span>
      <button id="test">テスト点灯</button>
      <button id="full">全画面</button>
    </div>
    <p class="hint">スタートはその場から作業を開始します（停止からの再開は残り時間を引き継ぎます）。リセットは先頭に戻して停止し、開始時刻がまだ先ならその時刻に自動で始まります。<br>
    設定はこの端末に保存されます。時計に合わせて動くので、タブを裏にしていても切り替え時刻はずれません。点滅は約2Hz（光感受性発作の目安3Hz未満）に抑えています。</p>
  </div>

  <div class="card">
    <h2>これからのフラッシュ</h2>
    <ol id="list"></ol>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var el = {
    badge:$("badge"), phase:$("phase"), clock:$("clock"), nextAt:$("nextAt"), cycleNo:$("cycleNo"),
    bar:$("bar"), segFrom:$("segFrom"), segTo:$("segTo"), list:$("list"), flash:$("flash"),
    start:$("start"), work:$("work"), brk:$("brk"),
    sound:$("sound"), atStart:$("atStart"), awake:$("awake"),
    go:$("go"), stop:$("stop"), reset:$("reset")
  };
  var KEY = "flash-timer-v1", MIN = 60000;

  /* ---------- 設定の保存と復元 ---------- */
  function loadSettings(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var s = JSON.parse(raw);
      if(s.start) el.start.value = s.start;
      if(s.work)  el.work.value  = s.work;
      if(s.brk)   el.brk.value   = s.brk;
      el.sound.checked   = s.sound !== false;
      el.atStart.checked = !!s.atStart;
      el.awake.checked   = s.awake !== false;
    }catch(e){/* 保存が使えない環境でもそのまま動かす */}
  }
  function saveSettings(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        start:el.start.value, work:el.work.value, brk:el.brk.value,
        sound:el.sound.checked, atStart:el.atStart.checked, awake:el.awake.checked
      }));
    }catch(e){}
  }

  /* ---------- 設定値 ---------- */
  function minutes(input, fallback){
    var v = parseInt(input.value, 10);
    if(!isFinite(v) || v < 1) v = fallback;
    return v > 600 ? 600 : v;
  }
  function conf(){
    var W = minutes(el.work, 50) * MIN, B = minutes(el.brk, 10) * MIN;
    return {W:W, B:B, C:W + B};
  }
  function startOfToday(now){
    var m = /^(\d{1,2}):(\d{2})/.exec(el.start.value || "08:30");
    var h = m ? Math.min(23, +m[1]) : 8, mi = m ? Math.min(59, +m[2]) : 30;
    var d = new Date(now); d.setHours(h, mi, 0, 0); return d.getTime();
  }

  /* ---------- 状態 ----------
     anchor : スケジュールの起点。ここから 作業→休憩 が繰り返される
     held   : 停止中に保持している「anchor からの経過」。null なら頭出し（未開始）
     running: 進行中かどうか。残り時間は毎回 anchor と時計から計算するのでずれない  */
  var anchor = null, held = null, running = false, seen = null, last = null;

  function segmentAt(t){
    var c = conf(), e = t - anchor, full = Math.floor(e / c.C), rem = e % c.C, base = anchor + full * c.C;
    var s = rem < c.W
      ? {kind:"work",  from:base,       to:base + c.W}
      : {kind:"break", from:base + c.W, to:base + c.C};
    s.base = base; s.cycle = full + 1; s.W = c.W; s.B = c.B; s.C = c.C;
    return s;
  }
  // いま画面に出すべき状態。at は残り時間の計算に使う「時刻」（一時停止中は止めた時刻）
  function view(now){
    var c = conf();
    if(running && now < anchor)
      return {state:"wait", kind:"wait", at:now, from:now, to:anchor, base:anchor, cycle:0, W:c.W, B:c.B, C:c.C};
    if(running){ var s = segmentAt(now); s.state = "run"; s.at = now; return s; }
    if(held !== null && held > 0){ var p = segmentAt(anchor + held); p.state = "paused"; p.at = anchor + held; return p; }
    if(held === null && anchor !== null && now < anchor)
      return {state:"wait", kind:"wait", at:now, from:now, to:anchor, base:anchor, cycle:0, W:c.W, B:c.B, C:c.C};
    return {state:"idle", kind:"idle", at:0, from:0, to:c.W, base:0, cycle:0, W:c.W, B:c.B, C:c.C};
  }

  // anchor からいままでに起きたフラッシュの回数。取りこぼしの検出に使う
  function flashCount(now){
    if(anchor === null || now < anchor) return 0;
    var c = conf(), e = now - anchor;
    return Math.floor(e / c.C) * 2 + (e % c.C >= c.W ? 1 : 0);
  }
  function flashTime(W, C, i){
    return anchor + Math.floor((i - 1) / 2) * C + (i % 2 === 1 ? W : C);
  }

  /* ---------- 表示 ---------- */
  function two(n){ return (n < 10 ? "0" : "") + n; }
  function hhmm(ms){ var d = new Date(ms); return two(d.getHours()) + ":" + two(d.getMinutes()); }
  function span(ms){
    var s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    return (h ? h + ":" + two(m) : m) + ":" + two(s % 60);
  }

  var LABEL = {wait:"開始待ち", run:{work:"作業中", "break":"休憩中"}, paused:"一時停止", idle:"停止中"};
  var COLOR = {work:"var(--work)", "break":"var(--brk)", wait:"var(--wait)", idle:"var(--wait)"};

  function render(now){
    var v = view(now), live = v.state === "run" || v.state === "wait";
    var color = live ? COLOR[v.kind] : COLOR.wait;
    document.documentElement.style.setProperty("--accent", color);
    el.badge.style.background = color;
    el.phase.textContent = v.state === "run" ? LABEL.run[v.kind] : LABEL[v.state];
    el.clock.textContent = span(v.to - v.at);

    if(v.state === "run"){
      el.nextAt.textContent = hhmm(v.to);
      el.cycleNo.textContent = "／ " + v.cycle + "セット目";
    }else if(v.state === "wait"){
      el.nextAt.textContent = hhmm(v.to + v.W);
      el.cycleNo.textContent = "／ " + hhmm(anchor) + " に開始";
    }else if(v.state === "paused"){
      el.nextAt.textContent = "—";
      el.cycleNo.textContent = "／ " + (v.kind === "work" ? "作業" : "休憩") + "の途中で停止中";
    }else{
      el.nextAt.textContent = "—";
      el.cycleNo.textContent = "／ スタートで開始します";
    }

    var total = v.to - v.from;
    el.bar.style.width = (total > 0 ? Math.max(0, Math.min(100, (v.at - v.from) / total * 100)) : 0) + "%";
    el.segFrom.textContent = live || v.state === "paused" ? hhmm(v.from) : "0:00";
    el.segTo.textContent   = live || v.state === "paused" ? hhmm(v.to)   : span(v.W);

    el.go.disabled = v.state === "run";
    el.stop.disabled = !running && v.state !== "wait";   // 自動開始の待ちも止められる

    document.title = span(v.to - v.at) + " "
      + (v.state === "run" ? LABEL.run[v.kind] : LABEL[v.state]) + " — フラッシュタイマー";

    if(live){
      var html = "", n = flashCount(now);
      for(var i = n + 1; i <= n + 6; i++){
        var t = flashTime(v.W, v.C, i);
        html += '<li' + (i === n + 1 ? ' class="soon"' : '') + '><time>' + hhmm(t) + "</time><span>"
              + (i % 2 === 1 ? "作業おわり → 休憩 " + (v.B / MIN) + "分"
                             : "休憩おわり → 作業 " + (v.W / MIN) + "分") + "</span></li>";
      }
      el.list.innerHTML = html;
    }else{
      el.list.innerHTML = "<li><span>" + (v.state === "paused"
        ? "停止中です。スタートで残り " + span(v.to - v.at) + " から再開します。"
        : "停止中です。スタートを押すと予定が入ります。") + "</span></li>";
    }
  }

  /* ---------- 光らせる・鳴らす ---------- */
  var audio = null;
  function beep(){
    if(!el.sound.checked) return;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      if(!audio) audio = new Ctx();
      if(audio.state === "suspended") audio.resume();
      [0, 0.28].forEach(function(offset){
        var t = audio.currentTime + offset, o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine"; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.24);
      });
    }catch(e){}
  }
  function flash(){
    el.flash.classList.remove("on");
    void el.flash.offsetWidth;          // アニメーションを最初から流し直す
    el.flash.classList.add("on");
    beep();
  }
  el.flash.addEventListener("animationend", function(){ el.flash.classList.remove("on"); });

  /* ---------- 画面を消さない ---------- */
  var lock = null;
  function updateWakeLock(){
    if(!("wakeLock" in navigator)) return;
    if(el.awake.checked && document.visibilityState === "visible"){
      if(lock) return;
      navigator.wakeLock.request("screen").then(function(l){
        lock = l; l.addEventListener("release", function(){ lock = null; });
      }).catch(function(){});
    }else if(lock){
      lock.release().catch(function(){}); lock = null;
    }
  }

  /* ---------- 操作 ---------- */
  function resync(now){ seen = flashCount(now); last = now; }   // 直後に鳴らさないための同期
  function refresh(){ var now = Date.now(); resync(now); render(now); }

  function doStart(){
    var now = Date.now();
    anchor = held !== null ? now - held : now;   // 一時停止からは残りをそのまま引き継ぐ
    held = null; running = true;
    saveSettings(); refresh();
  }
  function doStop(){
    var now = Date.now();
    held = running && now > anchor ? now - anchor : 0;
    running = false;
    refresh();
  }
  function doReset(){
    var now = Date.now();
    running = false; held = null; anchor = startOfToday(now);   // 開始時刻がまだ先なら自動で始まる
    refresh();
  }

  /* ---------- 本体のループ ---------- */
  function tick(){
    var now = Date.now();
    // 停止中で頭出しのまま開始時刻をまたいだら、そこから自動で始める
    if(!running && held === null && anchor !== null && last !== null && last < anchor && now >= anchor){
      running = true; resync(now);
      if(el.atStart.checked) flash();
    }else if(running && anchor !== null){
      var count = flashCount(now);
      if(seen !== null && count > seen) flash();               // 裏タブやスリープで飛ばしても取りこぼさない
      else if(el.atStart.checked && last !== null && last < anchor && now >= anchor) flash();
      seen = count;
    }
    last = now;
    render(now);
  }

  loadSettings();
  el.start.addEventListener("change", function(){
    var now = Date.now();
    if(!running || now < anchor) anchor = startOfToday(now);   // 進行中の回は動かさない
    saveSettings(); refresh();
  });
  [el.work, el.brk].forEach(function(i){ i.addEventListener("change", function(){ saveSettings(); refresh(); }); });
  [el.sound, el.atStart].forEach(function(i){ i.addEventListener("change", saveSettings); });
  el.awake.addEventListener("change", function(){ saveSettings(); updateWakeLock(); });

  el.go.addEventListener("click", doStart);
  el.stop.addEventListener("click", doStop);
  el.reset.addEventListener("click", doReset);
  $("test").addEventListener("click", flash);
  $("full").addEventListener("click", function(){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
  });
  document.addEventListener("visibilitychange", function(){
    updateWakeLock();
    if(document.visibilityState === "visible") tick();
  });

  // 開いた時点で開始時刻を過ぎていれば、その日のスケジュールに合流して進行中にする
  anchor = startOfToday(Date.now());
  running = true;
  refresh();
  setInterval(tick, 250);
  updateWakeLock();
})();
</script>
</body>
</html>
