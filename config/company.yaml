# =============================================================
#  note自動販売会社 — 会社設定ファイル
#  ここを書き換えるだけで「どんな会社か」が変わります。
# =============================================================

company:
  # 屋号。あなたの名義に書き換えてください（記事の署名ではなく、生成時の自己認識に使われます）
  name: "リモートアクセス実務ノート"
  # 会社の一行定義。全部署のプロンプトの土台になります。
  mission: "情シス専任者がいない会社でも、社外から安全に働ける環境を自力で構築できるところまで手順に落とす"
  # 誰に売るのか。ここがブレると価格もCVRもブレます。
  audience: "社員10〜50人規模で情報システムの専任者がおらず、総務や管理部門の担当者が兼任でIT環境を見ている会社の担当者"
  # 何屋なのか（1〜3個に絞る。増やすほど売れなくなります）
  domains:
    - "中小企業のリモートアクセス環境（VPN・ゼロトラスト）の選定と構築"
    - "社外から業務システムを使うためのセキュリティ運用"
  tone: "製品名を出すときは、自分で検証した範囲と検証していない範囲を必ず分けて書く。断定を避け、なぜその判断になるかの根拠を示す。煽らない。"
  # 書いてはいけないこと（プロンプトにそのまま制約として渡されます）
  prohibitions:
    - "実際に検証していない製品の設定手順を、検証済みであるかのように書くこと"
    - "「これで完全に安全になる」といったセキュリティ上の断定"
    - "各サービスの利用規約に反する使い方の指南（動画配信の地域制限の回避を含む）"
    - "再現性のない収益実績の断言"
    - "投資・医療・法律の個別具体的な助言"
    - "出典のない統計値の記載"

# ---------------- 商品設計 ----------------
product:
  target_chars: 7000        # 1記事あたりの目標文字数（無料＋有料）。手順もので短いと信用されない
  free_ratio: 0.30          # 無料で読める割合。買うかどうかはほぼここで決まる
  price:
    min: 500                # 読者が法人担当者なので下限を上げている
    max: 3000
    default: 980
    depth_weight: 500       # 手順の具体性・独自性で上乗せする額
    demand_weight: 300      # リサーチが観測した需要で上乗せする額
    round_to: 10
  tags_per_article: 5

# ---------------- 部署ごとの設定 ----------------
staff:
  # --- リサーチ担当：毎朝、X と Threads から伸びてるポストを収集する ---
  research:
    sources: ["manual"]     # 有効化するソース: x / threads / manual
    lookback_hours: 24
    top_n: 15               # ブリーフに載せる上位シグナル数
    themes_per_brief: 5
    x:
      queries:
        - "リモートワーク VPN 遅い -is:retweet lang:ja"
        - "ひとり情シス -is:retweet lang:ja"
        - "ゼロトラスト 中小企業 -is:retweet lang:ja"
      min_engagement: 100   # いいね+リポスト+返信の合計がこの値未満は捨てる
      max_results: 50
    threads:
      keywords: ["情シス", "リモートワーク", "VPN", "テレワーク セキュリティ"]
      max_results: 50
    manual:
      # 人手・外部ツールで集めたポストを置く場所（JSON または CSV）
      inbox: "data/inbox"

  # --- 企画担当：売れたデータと照らして次に出す note を提案する ---
  planning:
    topics_per_planning: 5
    sales_lookback_days: 90
    min_evidence: 2         # 1企画あたり最低いくつのシグナルを根拠にするか

  # --- 執筆担当：売れた note とレターのデータを使って本文を書く ---
  writing:
    reference_top_n: 3      # 参考にする「売れた記事」の本数
    letter_dir: "data/letters"   # 過去に配信したレター（メール等）の置き場

  # --- 検品担当：別コンテキストのAIが「AIっぽい言い回し」だけを直す ---
  qa:
    model: "claude-opus-5"  # 執筆と切り離した検品AI。別モデルを指定してもよい
    max_change_ratio: 0.35  # これ以上書き換わったら人間レビューに回す
    banned_phrases:
      - "いかがでしたでしょうか"
      - "本記事では"
      - "〜ではないでしょうか"
      - "まとめると、"
      - "重要なポイントは"
      - "ぜひ参考にしてみてください"
      - "近年、"
      - "〜と言えるでしょう"
      - "セキュリティ対策は非常に重要です"
      - "自社に合ったものを選びましょう"
      - "DX推進が求められる中"

  # --- デザイン担当：表紙と記事内の画像を作る ---
  design:
    cover_width: 1280
    cover_height: 670       # note の見出し画像の推奨比率
    inline_images: 2
    palette:
      - "#0f172a"
      - "#1d4ed8"
      - "#f8fafc"
      - "#f59e0b"

  # --- 営業担当：集客ポストを作って予約投稿まで済ませる ---
  sales:
    channels: ["x", "threads"]
    posts_per_article: 3
    # 公開からの経過時間（時間）ごとに1本ずつ予約する
    schedule_offsets_hours: [0, 24, 72]
    # 予約は各日のこの時刻に寄せる（24時間表記）
    preferred_hours: [8, 12, 21]
    autopost: false         # true にすると実際に API 投稿する（要 docs/legal-and-risk.md）

# ---------------- 運営リズム ----------------
operations:
  articles_per_week: 3

# ---------------- 収益計算の前提 ----------------
# 注意: 手数料率は改定されます。運用前に note の公式ヘルプで最新値を確認し、
#       ここを実測値に合わせてください（docs/business-plan.md 参照）。
economics:
  platform_fee_rate: 0.15   # 決済手数料（カード決済想定の概算・要確認）
  note_fee_rate: 0.10       # note 利用料（決済手数料を引いた残りに対して・要確認）
  withdrawal_fee: 270       # 振込手数料（1回あたり・要確認）
  variable_cost_per_article: 120   # API利用料・素材費などの想定変動費

# ---------------- 生成モデル設定 ----------------
llm:
  model: "claude-opus-5"
  effort: "high"            # low / medium / high / xhigh / max
  max_tokens_short: 16000   # 企画・告知など短い生成
  max_tokens_long: 64000    # 本文執筆・検品（ストリーミング）

# ---------------- 出力先 ----------------
paths:
  out_dir: "out"
  db_path: "data/noteshop.db"
